<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0c10">
<title>照片墙 · 无损传输</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/gallery.css">
</head>
<body data-page="gallery" class="gallery">

<!-- floating pill nav (visual reference: the mqz photo-wall site) -->
<nav class="gnav" aria-label="主导航">
  <a class="gnav-brand" href="/">
    <span class="logo">⇄</span>
    <span class="gnav-title">无损传输</span>
  </a>
  <div class="gnav-links">
    <a href="/">首页</a>
    <a class="is-active" href="/gallery" aria-current="page">照片墙</a>
  </div>
  <div class="gnav-side">
    <span id="libPill" class="pill hidden"></span>
    <span id="connBadge" class="badge badge-off">未连接</span>
    <button id="refreshBtn" class="gnav-icon" type="button" title="刷新" aria-label="刷新">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>
</nav>

<main class="wall-main">
  <div class="wall-toolbar">
    <div class="wall-count">
      <h1 class="wall-title">照片墙</h1>
      <span id="libCount" class="wall-sub"></span>
    </div>
    <div class="wall-tools">
      <label class="check-inline">
        <input type="checkbox" id="selectAll" disabled>
        <span>全选</span>
      </label>
      <button id="invertBtn" class="btn ghost small" disabled>反选</button>
    </div>
  </div>

  <!-- masonry columns are generated by app.js (greedy height balancing) -->
  <div id="fileList" class="wall" aria-live="polite"></div>

  <div id="selBar" class="selbar hidden">
    <span id="selText" class="sel-text"></span>
    <div class="row">
      <button id="selClearBtn" class="btn ghost small" type="button">取消选择</button>
      <button id="selDownloadBtn" class="btn primary" type="button">下载选中</button>
    </div>
  </div>

  <p class="wall-foot">
    预览与原图共用一份文件：不解码、不重编码、不缩放、不压缩、不改 EXIF/元数据 ——
    <b>与原文件字节完全相同</b>。
  </p>
</main>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!-- lightbox: built once from this template by app.js -->
<template id="lightboxTpl">
  <div class="lb" role="dialog" aria-modal="true" aria-label="媒体预览">
    <div class="lb-backdrop" data-lb="bg"></div>
    <button class="lb-nav lb-prev" data-lb="prev" aria-label="上一张" title="上一张 (←)">‹</button>
    <button class="lb-nav lb-next" data-lb="next" aria-label="下一张" title="下一张 (→)">›</button>
    <figure class="lb-stage">
      <img class="lb-img hidden" alt="" draggable="false">
      <video class="lb-video hidden" controls playsinline preload="metadata"></video>
      <div class="lb-fallback hidden"></div>
      <div class="lb-spinner" aria-hidden="true"></div>
    </figure>
    <div class="lb-bar">
      <div class="lb-title"><span class="lb-name"></span><span class="lb-sub"></span></div>
      <div class="row">
        <label class="check-inline lb-pick"><input type="checkbox" data-lb="pick"><span>选中</span></label>
        <button class="btn ghost small" data-lb="download">下载并校验</button>
        <button class="btn ghost small lb-close" data-lb="close" aria-label="关闭" title="关闭 (Esc)">✕</button>
      </div>
    </div>
  </div>
</template>

<script src="/sha256.js"></script>
<script src="/app.js"></script>
</body>
</html>
